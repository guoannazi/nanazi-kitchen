<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>娜娜子美妈厨房日记</title>
<link rel="icon" type="image/x-icon" href="favicon-v2.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
<style>
  :root{
    --bg:#fff5f7;
    --card:#ffffff;
    --text:#4a3a40;
    --muted:#a89098;
    --border:#f5d8e0;
    --baby:#fff0f5;          /* 辅食粉白 */
    --baby-accent:#e87fa0;
    --baby-tag:#ffc8d8;
    --adult:#ffe4ec;          /* 大人亮粉 */
    --adult-accent:#e87fa0;
    --adult-tag:#ffb4c8;
    --primary:#e87fa0;
    --primary-dark:#d06088;
    --green:#7cb342;
    --shadow:0 2px 10px rgba(220,100,140,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }
  /* Header */
  header{
    background:linear-gradient(135deg,#e87fa0 0%,#ffb4c8 100%);
    color:#fff;
    padding:18px 16px 14px;
    box-shadow:0 2px 12px rgba(232,127,160,.25);
  }
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.9;margin-top:3px}
  header .date-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  header .date-row input[type=date]{
    background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);
    color:#fff;border-radius:6px;padding:3px 8px;font-size:13px;
  }
  header .date-row input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}

  /* Tabs */
  .tabs{
    display:flex;background:var(--card);
    position:sticky;top:0;z-index:10;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
  }
  .tab{
    flex:1;padding:13px 4px;text-align:center;font-size:13px;font-weight:600;
    color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;
    transition:all .2s;
  }
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}
  .tab:active{background:#f5f0ea}

  /* Container */
  .container{max-width:760px;margin:0 auto;padding:12px 14px}
  .panel{display:none}
  .panel.active{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Section title */
  .sec-title{
    font-size:14px;font-weight:700;margin:14px 0 8px;
    display:flex;align-items:center;gap:6px;
  }
  .sec-title .dot{width:8px;height:8px;border-radius:50%}

  /* Search / filter bar */
  .bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
  .bar input[type=text]{
    flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;background:#fff;
  }
  .bar select,.bar button.small{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:13px;background:#fff;color:var(--text);cursor:pointer;
  }
  .bar button.primary{
    background:var(--primary);color:#fff;border:none;padding:8px 14px;
    border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* Recipe cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .card{
    background:var(--card);border-radius:12px;padding:11px 12px;
    box-shadow:var(--shadow);border:1px solid var(--border);
    position:relative;transition:transform .15s,box-shadow .15s;
  }
  .card:active{transform:scale(.98)}
  .card.baby{background:var(--baby);border-color:#ffd8e4}
  .card.adult{background:var(--adult);border-color:#ffc0d0}
  .card .name{font-size:15px;font-weight:700;margin-bottom:5px;padding-right:60px}
  .card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .tag{
    font-size:11px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.7);
    color:#666;
  }
  .card.baby .tag.month{background:var(--baby-accent);color:#fff}
  .card.adult .tag.cat{background:var(--adult-accent);color:#fff}
  .tag.spicy{background:#d86070;color:#fff}
  .card .ing{font-size:12px;color:#7a6a5e;line-height:1.4}
  .card .ing b{color:#5a4a3e}
  .card .note{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
  .card .thumb{
    width:100%;height:90px;border-radius:8px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:42px;background:linear-gradient(135deg,#fce8ec,#fef0f4);
  }
  .card.baby .thumb{background:linear-gradient(135deg,#fef0f4,#f8e0e8)}
  .card .actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
  .card .actions button{
    background:rgba(255,255,255,.85);border:none;border-radius:6px;
    width:24px;height:24px;font-size:12px;cursor:pointer;color:#666;
  }
  .card .actions button:active{background:#fff}

  /* Modal */
  .modal-mask{
    position:fixed;inset:0;background:rgba(40,20,10,.5);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-mask.show{display:flex;animation:fade .2s}
  .modal{
    background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:16px;animation:slideup .25s;
  }
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal h3{margin:0 0 12px;font-size:17px}
  .form-row{margin-bottom:10px}
  .form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .form-row input,.form-row select,.form-row textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;
  }
  .form-row textarea{resize:vertical;min-height:50px}
  .modal .btns{display:flex;gap:8px;margin-top:14px}
  .modal .btns button{flex:1;padding:11px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-cancel{background:#f0e8df;color:#666}
  .btn-save{background:var(--primary);color:#fff}

  /* Today menu */
  .meal{
    background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;
    box-shadow:var(--shadow);
  }
  .meal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .meal .head .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
  .meal .head .add-btn{
    background:#ffe4ec;border:1px solid #ffc0d0;color:var(--adult-accent);
    padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .meal-item{
    display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;
    border-radius:8px;font-size:14px;
  }
  .meal-item.baby{background:var(--baby)}
  .meal-item.adult{background:var(--adult)}
  .meal-item.done{opacity:.5;text-decoration:line-through}
  .meal-item .chk{width:20px;height:20px;flex-shrink:0;cursor:pointer}
  .meal-item .nm{flex:1}
  .meal-item .del{background:none;border:none;color:#c00;font-size:16px;cursor:pointer;padding:0 4px}
  .meal-empty{font-size:12px;color:var(--muted);text-align:center;padding:8px;font-style:italic}

  /* Pick / random */
  .pick-box{
    background:var(--card);border-radius:14px;padding:20px;text-align:center;
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  .pick-box .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .pick-box .opts button{
    padding:8px 14px;border:1px solid var(--border);border-radius:20px;
    background:#fff;font-size:13px;cursor:pointer;font-weight:600;
  }
  .pick-box .opts button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .shake-btn{
    background:linear-gradient(135deg,#e87fa0,#ffb4c8);color:#fff;border:none;
    padding:14px 30px;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(232,127,160,.35);
  }
  .shake-btn:active{transform:scale(.95)}
  .result-card{
    margin-top:18px;padding:18px;border-radius:14px;min-height:60px;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:#f5f0ea;color:var(--muted);font-size:14px;
  }
  .result-card.has{background:var(--card);box-shadow:var(--shadow);color:var(--text)}
  .result-card .rname{font-size:22px;font-weight:700;margin-bottom:6px}
  .result-card .rtags{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:6px}
  .result-card .ring{font-size:12px;color:var(--muted)}
  .result-card .add-today{
    margin-top:10px;background:var(--green);color:#fff;border:none;
    padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .shake-anim{animation:shake .5s infinite}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px) rotate(-2deg)}
    75%{transform:translateX(4px) rotate(2deg)}
  }
  .combo-section{margin-top:18px}
  .combo-section .lbl{font-size:13px;color:var(--muted);margin-bottom:8px;text-align:center}

  /* Shopping list */
  .shop-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);
    border-radius:10px;margin-bottom:6px;box-shadow:var(--shadow);
  }
  .shop-item .chk{width:22px;height:22px;cursor:pointer;flex-shrink:0}
  .shop-item .nm{flex:1;font-size:14px}
  .shop-item .qt{font-size:12px;color:var(--muted)}
  .shop-item.done .nm{text-decoration:line-through;opacity:.5}
  .copy-btn{
    width:100%;background:var(--green);color:#fff;border:none;padding:12px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px;
  }
  .empty-state{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}

  /* Sync */
  .sync-bar{
    display:flex;gap:8px;align-items:center;margin:10px 0;padding:10px 12px;
    background:linear-gradient(90deg,#fff4e6,#ffe9d6);border-radius:10px;
    box-shadow:var(--shadow);font-size:13px;
  }
  .sync-bar .who{flex:1}
  .sync-bar input[name=who]{
    border:1px solid var(--border);border-radius:6px;padding:5px 8px;
    font-size:13px;width:90px;
  }
  .sync-bar button{
    background:var(--primary);color:#fff;border:none;padding:7px 12px;
    border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .sync-bar button.qr{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .sync-status{font-size:11px;color:var(--muted);margin-top:4px}
  .family-card{
    background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:8px;
    box-shadow:var(--shadow);border-left:4px solid var(--primary);
  }
  .family-card .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .family-card .fname{font-weight:700;font-size:14px}
  .family-card .ftime{font-size:11px;color:var(--muted)}
  .family-card .fpick{
    display:inline-block;background:#ffe4ec;padding:3px 9px;border-radius:8px;
    font-size:13px;margin:2px 4px 2px 0;
  }
  .family-card .fpick.baby{background:var(--baby)}
  .family-card .fnote{font-size:12px;color:#888;margin-top:5px;font-style:italic}
  .qr-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center}
  .qr-mask.show{display:flex}
  .qr-box{background:#fff;padding:20px;border-radius:14px;text-align:center;max-width:90%}
  .qr-box img{width:240px;height:240px;margin:10px 0}
  .qr-box .close{margin-top:10px;background:#eee;border:none;padding:8px 20px;border-radius:8px;cursor:pointer}

  /* Lazy mode */
  .lazy-card{
    background:linear-gradient(135deg,#fff0f5,#ffe4ec);
    border:2px dashed #e87fa0;border-radius:18px;
    padding:30px 20px;text-align:center;box-shadow:var(--shadow);
  }
  .lazy-card .lazy-icon{font-size:52px;margin-bottom:10px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .lazy-card .lazy-title{font-size:22px;font-weight:700;color:#e06088;margin-bottom:8px}
  .lazy-card .lazy-sub{font-size:14px;color:#a07080;margin-bottom:18px}
  .lazy-card .lazy-back{
    background:#e87fa0;color:#fff;border:none;padding:10px 24px;border-radius:20px;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  #lazyBtn.active{background:#e87fa0;color:#fff;border-style:solid}

  /* Toast */
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(40,30,25,.92);color:#fff;padding:9px 18px;border-radius:20px;
    font-size:13px;z-index:200;opacity:0;transition:opacity .25s,bottom .25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;bottom:30px}

  /* Add-to-today select dropdown inside meal */
  .add-select-wrap{
    margin-top:6px;display:none;flex-direction:column;gap:6px;
  }
  .add-select-wrap.show{display:flex}
  .add-select-wrap select{
    padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;
  }
  .add-select-wrap .go{
    background:var(--primary);color:#fff;border:none;padding:8px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;
  }

  @media(max-width:520px){
    .grid{grid-template-columns:1fr}
    header h1{font-size:18px}
    .tab{font-size:12px}
  }
</style>
</head>
<body>

<header>
  <h1>🍳 娜娜子美妈厨房日记</h1>
  <div class="sub">宝宝辅食 · 大人美食 · 一站搞定</div>
  <div class="date-row">
    <span>📅</span>
    <input type="date" id="todayDate">
    <span style="flex:1"></span>
    <button id="clearToday" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer">清空今日</button>
  </div>
</header>

<div class="tabs" id="mainTabs">
  <div class="tab active" data-tab="menu">📋 今日菜单</div>
  <div class="tab" data-tab="recipes">📚 菜谱库</div>
  <div class="tab" data-tab="pick">🎲 点餐抽餐</div>
  <div class="tab" data-tab="family">👨‍👩‍👧 家人点餐</div>
  <div class="tab" data-tab="shop">🛒 食材清单</div>
</div>

<!-- 家人点餐模式（简化版） -->
<div id="familyMode" style="display:none">
  <div style="padding:14px;background:linear-gradient(135deg,#e87fa0,#ffb4c8);color:#fff">
    <div style="font-size:17px;font-weight:700">🍴 娜娜子美妈厨房 · 家人点餐</div>
    <div style="font-size:12px;opacity:.9;margin-top:3px">选你想吃的菜，提交后妈妈就能看到</div>
  </div>
  <div style="padding:12px 14px">
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <span style="font-size:13px;font-weight:600">👤 我是：</span>
      <input type="text" id="fmWho" placeholder="爸爸/奶奶/姐姐..." style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px">
    </div>
    <div class="bar">
      <input type="text" id="fmSearch" placeholder="🔍 搜索菜名...">
      <select id="fmType">
        <option value="all">全部</option>
        <option value="baby">👶 宝宝辅食</option>
        <option value="adult">👩 大人餐</option>
      </select>
    </div>
    <div id="fmList" style="margin-top:10px"></div>
    <div id="fmCart" style="position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:20;display:none">
      <div id="fmCartItems" style="max-height:120px;overflow-y:auto;margin-bottom:8px"></div>
      <button id="fmSubmitBtn" onclick="fmSubmit()" style="width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">提交点餐</button>
    </div>
    <div style="height:140px"></div>
  </div>
</div>

<div class="container">

  <!-- 今日菜单 -->
  <div class="panel active" id="panel-menu">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button id="lazyBtn" onclick="toggleLazy()" style="flex:1;background:#fff0f5;border:1.5px dashed #e87fa0;color:#e87fa0;padding:10px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer">今天不想做饭</button>
    </div>
    <div id="lazyView" style="display:none">
      <div class="lazy-card">
        <div class="lazy-icon">
          <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" style="width:110px;height:92px">
            <!-- 沙发 -->
            <rect x="10" y="55" width="100" height="30" rx="10" fill="#f8c8d8"/>
            <rect x="5" y="45" width="20" height="45" rx="8" fill="#f0b0c8"/>
            <rect x="95" y="45" width="20" height="45" rx="8" fill="#f0b0c8"/>
            <!-- 枕头 -->
            <ellipse cx="30" cy="58" rx="12" ry="8" fill="#fff"/>
            <!-- 妈妈身体 -->
            <ellipse cx="55" cy="62" rx="22" ry="10" fill="#e87fa0"/>
            <!-- 头 -->
            <circle cx="32" cy="56" r="9" fill="#ffd0b8"/>
            <!-- 头发 -->
            <path d="M22 52 Q32 40 42 52 Q40 58 32 58 Q24 58 22 52" fill="#5a3a40"/>
            <!-- 闭着的眼睛 -->
            <path d="M29 56 Q32 58 35 56" stroke="#5a3a40" stroke-width="1.2" fill="none"/>
            <!-- 锅铲掉在地上 -->
            <rect x="95" y="82" width="4" height="14" rx="1" fill="#b0a090"/>
            <ellipse cx="97" cy="80" rx="6" ry="4" fill="#c0b0a0"/>
            <!-- 休息气泡 -->
            <circle cx="82" cy="35" r="14" fill="#fff" opacity="0.9"/>
            <text x="82" y="40" text-anchor="middle" font-size="12" fill="#e87fa0" font-weight="700">Zzz</text>
          </svg>
        </div>
        <div class="lazy-title">妈妈今天不想做饭</div>
        <div class="lazy-sub">宝宝今天吃外卖 / 出去吃 / 爸爸做吧</div>
        <button class="lazy-back" onclick="toggleLazy()">恢复营业</button>
      </div>
    </div>
    <div id="mealsList"></div>
  </div>

  <!-- 菜谱库 -->
  <div class="panel" id="panel-recipes">
    <div class="bar">
      <input type="text" id="searchInput" placeholder="🔍 搜索菜名/食材...">
      <select id="filterType">
        <option value="all">全部</option>
        <option value="baby">👶 宝宝辅食</option>
        <option value="adult">👩 大人餐</option>
      </select>
      <select id="filterCat">
        <option value="all">全部分类</option>
      </select>
      <button class="primary" onclick="openRecipeModal()">+ 新增</button>
    </div>

    <div class="sec-title"><span class="dot" style="background:var(--baby-accent)"></span>👶 宝宝辅食</div>
    <div class="grid" id="babyGrid"></div>

    <div class="sec-title"><span class="dot" style="background:var(--adult-accent)"></span>👩 大人餐</div>
    <div class="grid" id="adultGrid"></div>
  </div>

  <!-- 点餐抽餐 -->
  <div class="panel" id="panel-pick">
    <div class="pick-box">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px">🎲 随机抽一道菜</div>
      <div class="opts" id="pickTypeOpts">
        <button data-v="baby">👶 宝宝</button>
        <button data-v="adult" class="active">👩 大人</button>
        <button data-v="all">全部</button>
      </div>
      <button class="shake-btn" onclick="doShake()">🎲 摇一摇</button>
      <div class="result-card" id="resultCard">点"摇一摇"看看今天吃啥～</div>
    </div>

    <div class="combo-section">
      <div class="lbl">—— 智能搭配（大人餐两菜一汤）——</div>
      <div style="text-align:center">

function toast(msg){

function uid(){
  return 'r'+Date.now()+Math.floor(Math.random()*1000);
}
function todayStr(){

let fmCart = [];  // 家人购物车 [{recipeId, name, type, meal, note}]

function ensureTodayMenu(){

    saveMenu();
  }
}
function bindEvents(){
  // tabs
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');

      if(t.dataset.tab==='shop') renderShop();
      if(t.dataset.tab==='family') renderFamily();
    };
  });
  // date change
  document.getElementById('todayDate').onchange = ()=>{
    ensureTodayMenu();
    renderMeals();
  };
  // clear today
  document.getElementById('clearToday').onclick = ()=>{
    if(confirm('确定清空今日菜单吗？')){
      todayMenu = getEmptyMenu(document.getElementById('todayDate').value);

      renderMeals();
      toast('已清空');
    }
  };

  document.getElementById('searchInput').oninput = renderRecipes;
  document.getElementById('filterType').onchange = ()=>{
    updateFilterCat();
    renderRecipes();
  };

  document.querySelectorAll('#pickTypeOpts button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('#pickTypeOpts button').forEach(x=>x.classList.remove('active'));

    };

}

/* ============ 菜谱库 ============ */
function updateFilterCat(){
  const type = document.getElementById('filterType').value;
  const sel = document.getElementById('filterCat');
  sel.innerHTML = '<option value="all">全部分类</option>';
  let cats = [];
  if(type === 'baby'){
    cats = ['8M+','12M+','18M+'];
    cats.forEach(c=>{
      const o = document.createElement('option');
      o.value = c; o.textContent = '月龄 '+c;
      sel.appendChild(o);
    });
  }else if(type === 'adult'){
    cats = [...new Set(recipes.filter(r=>r.type==='adult').map(r=>r.cat))].sort();
    cats.forEach(c=>{
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  }else{
    // both
    const months = ['8M+','12M+','18M+'];
    months.forEach(c=>{
      const o = document.createElement('option');
      o.value = 'm_'+c; o.textContent = '月龄 '+c;
      sel.appendChild(o);
    });
    const adultCats = [...new Set(recipes.filter(r=>r.type==='adult').map(r=>r.cat))].sort();
    adultCats.forEach(c=>{
      const o = document.createElement('option');
      o.value = 'a_'+c; o.textContent = c;
      sel.appendChild(o);
    });
  }
}

function renderRecipes(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('filterType').value;
  const cat = document.getElementById('filterCat').value;
  const babyGrid = document.getElementById('babyGrid');
  const adultGrid = document.getElementById('adultGrid');
  babyGrid.innerHTML = '';
  adultGrid.innerHTML = '';

  const filtered = recipes.filter(r=>{
    if(q && !r.name.toLowerCase().includes(q) && !(r.ing||'').toLowerCase().includes(q)) return false;
    if(type !== 'all' && r.type !== type) return false;
    if(cat !== 'all'){
      if(type === 'all'){
        if(cat.startsWith('m_')){
          if(r.type !== 'baby' || r.month !== cat.slice(2)) return false;
        }else if(cat.startsWith('a_')){
          if(r.type !== 'adult' || r.cat !== cat.slice(2)) return false;
        }
      }else if(type === 'baby'){
        if(r.type !== 'baby' || r.month !== cat) return false;
      }else if(type === 'adult'){
        if(r.type !== 'adult' || r.cat !== cat) return false;
      }
    }
    return true;
  });

  const babies = filtered.filter(r=>r.type==='baby');
  const adults = filtered.filter(r=>r.type==='adult');

  if(babies.length === 0) babyGrid.innerHTML = '<div class="empty-state">暂无宝宝辅食</div>';
  babies.forEach(r=>babyGrid.appendChild(makeCard(r)));
  if(adults.length === 0) adultGrid.innerHTML = '<div class="empty-state">暂无大人餐</div>';
  adults.forEach(r=>adultGrid.appendChild(makeCard(r)));
}

function makeCard(r){
  const div = document.createElement('div');
  div.className = 'card '+r.type;
  let tags = '';
  if(r.type==='baby'){
    tags += `<span class="tag month">${r.month}</span>`;
    tags += `<span class="tag">${r.cook}</span>`;
  }else{
    tags += `<span class="tag cat">${r.cat||'其他'}</span>`;
    if(r.spicy && r.spicy !== '不辣') tags += `<span class="tag spicy">${r.spicy}</span>`;
  }
  const emoji = recipeEmoji(r);
  const thumb = r.img
    ? `<img src="${r.img}" style="width:100%;height:90px;object-fit:cover;border-radius:8px;margin-bottom:8px" alt="${escapeHtml(r.name)}">`
    : `<div class="thumb">${emoji}</div>`;
  div.innerHTML = `
    <div class="actions">
      <button onclick="editRecipe('${r.id}')" title="编辑">✏️</button>
      <button onclick="delRecipe('${r.id}')" title="删除">🗑️</button>
    </div>
    ${thumb}
    <div class="name">${escapeHtml(r.name)}</div>
    <div class="tags">${tags}</div>
    <div class="ing"><b>食材：</b>${escapeHtml(r.ing||'未填')}</div>
    ${r.source ? `<div class="ing" style="margin-top:3px"><b>来源：</b>${escapeHtml(r.source)}</div>` : ''}
    ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
  `;
  return div;
}

function recipeEmoji(r){
  if(r.type==='baby'){
    const map = {'番茄鸡蛋面':'🍅🍜','虾仁豆腐蒸蛋':'🦐🥚','山药排骨汤':'🥣','蔬菜蛋饼':'🥞','胡萝卜肉末焖饭':'🥕🍚','鳕鱼蔬菜粥':'🐟🥣','鸡肝菠菜粥':'🥬🥣','番茄牛肉面':'🍅🍜','南瓜小米粥':'🎃🥣','三文鱼西兰花饭':'🐟🍚','猪肉白菜小馄饨':'🥟','土豆胡萝卜炖牛肉':'🥩🥕','奶香玉米烙':'🌽','鸡蛋疙瘩汤':'🍳🥣','鲜虾蔬菜饭团':'🍤🍚'};
    return map[r.name] || '🍳';
  }
  const cat = r.cat || '';
  const catMap = {'江西辣鸡爪':'🌶️','面食':'🍜','排骨':'🍖','鸡翅':'🍗','鸡鸭':'🐔','鱼虾海鲜':'🦐','家常小炒':'🍳','汤羹':'🥣','村驴菜系':'👨‍🍳'};
  return catMap[cat] || '🍽️';
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ 菜谱表单 ============ */
function openRecipeModal(id){
  document.getElementById('recipeId').value = id || '';
  document.getElementById('modalTitle').textContent = id ? '编辑菜谱' : '新增菜谱';
  if(id){
    const r = recipes.find(x=>x.id===id);
    if(!r) return;
    document.getElementById('fType').value = r.type;
    document.getElementById('fName').value = r.name;
    if(r.type==='baby'){
      document.getElementById('fMonth').value = r.month;
      document.getElementById('fCook').value = r.cook;
    }else{
      document.getElementById('fCat').value = r.cat || '其他';
      document.getElementById('fSpicy').value = r.spicy || '不辣';
    }
    document.getElementById('fIng').value = r.ing || '';
    document.getElementById('fSource').value = r.source || '';
    document.getElementById('fNote').value = r.note || '';
  }else{
    document.getElementById('fType').value = 'baby';
    document.getElementById('fName').value = '';
    document.getElementById('fMonth').value = '18M+';
    document.getElementById('fCook').value = '蒸';
    document.getElementById('fCat').value = '其他';
    document.getElementById('fSpicy').value = '不辣';
    document.getElementById('fIng').value = '';
    document.getElementById('fSource').value = '';
    document.getElementById('fNote').value = '';
  }
  onTypeChange();
  document.getElementById('recipeModal').classList.add('show');
}
function closeRecipeModal(){
  document.getElementById('recipeModal').classList.remove('show');
}
function onTypeChange(){
  const t = document.getElementById('fType').value;
  const isBaby = t === 'baby';
  document.getElementById('rowMonth').style.display = isBaby ? '' : 'none';
  document.getElementById('rowCook').style.display = isBaby ? '' : 'none';
  document.getElementById('rowCat').style.display = isBaby ? 'none' : '';
  document.getElementById('rowSpicy').style.display = isBaby ? 'none' : '';
}
function saveRecipe(){
  const id = document.getElementById('recipeId').value;
  const type = document.getElementById('fType').value;
  const name = document.getElementById('fName').value.trim();
  if(!name){ toast('请输入菜名'); return; }
  const data = {
    type, name,
    ing: document.getElementById('fIng').value.trim(),
    source: document.getElementById('fSource').value.trim(),
    note: document.getElementById('fNote').value.trim(),
  };
  if(type==='baby'){
    data.month = document.getElementById('fMonth').value;
    data.cook = document.getElementById('fCook').value;
  }else{
    data.cat = document.getElementById('fCat').value;
    data.spicy = document.getElementById('fSpicy').value;
  }
  if(id){
    const idx = recipes.findIndex(r=>r.id===id);
    if(idx>=0){ recipes[idx] = {...recipes[idx], ...data}; }
    toast('已更新');
  }else{
    data.id = uid();
    recipes.push(data);
    toast('已添加');
  }
  saveRecipes();
  updateFilterCat();
  renderRecipes();
  closeRecipeModal();
}
function editRecipe(id){ openRecipeModal(id); }
function delRecipe(id){
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  if(confirm(`删除「${r.name}」吗？`)){
    recipes = recipes.filter(x=>x.id!==id);
    saveRecipes();
    updateFilterCat();
    renderRecipes();
    toast('已删除');
  }
}

/* ============ 今日菜单 ============ */
function renderMeals(){
  const wrap = document.getElementById('mealsList');
  const lazyBtn = document.getElementById('lazyBtn');
  const lazyView = document.getElementById('lazyView');

  // 懒洋洋模式开关显示
  if(lazyBtn){
    lazyBtn.classList.toggle('active', lazyMode);
    lazyBtn.textContent = lazyMode ? '恢复营业' : '今天不想做饭';
  }
  if(lazyView){
    lazyView.style.display = lazyMode ? 'block' : 'none';
  }

  wrap.innerHTML = '';
  if(lazyMode){
    return; // 慵懒模式不显示餐次
  }

  MEALS.forEach(m=>{
    const items = todayMenu[m.key] || [];
    const div = document.createElement('div');
    div.className = 'meal';
    let itemsHtml = '';
    if(items.length === 0){
      itemsHtml = '<div class="meal-empty">还没有添加菜品，点右上角 + 添加</div>';
    }else{
      itemsHtml = items.map((it,i)=>`
        <div class="meal-item ${it.type} ${it.done?'done':''}">
          <input type="checkbox" class="chk" ${it.done?'checked':''} onchange="toggleDone('${m.key}',${i})">
          <span class="nm">${it.type==='baby'?'👶':'👩'} ${escapeHtml(it.name)}${it.who?` <span style="font-size:11px;color:var(--primary);font-weight:600">（${escapeHtml(it.who)}点）</span>`:''}</span>
          <button class="del" onclick="delMealItem('${m.key}',${i})">×</button>
        </div>
      `).join('');
    }
    div.innerHTML = `
      <div class="head">
        <div class="t">${m.label} <span style="font-size:12px;color:var(--muted);font-weight:400">${items.length}道</span></div>
        <button class="add-btn" onclick="openAddToday('${m.key}')">+ 添加</button>
      </div>
      ${itemsHtml}
    `;
    wrap.appendChild(div);
  });
}
function toggleDone(mealKey, idx){
  todayMenu[mealKey][idx].done = !todayMenu[mealKey][idx].done;

  renderMeals();
}
function delMealItem(mealKey, idx){
  todayMenu[mealKey].splice(idx,1);
  saveMenu();
  renderMeals();
}
function openAddToday(mealKey){
  currentAddMeal = mealKey;
  const m = MEALS.find(x=>x.key===mealKey);

  });

function closeAddToday(){
  document.getElementById('addTodayModal').classList.remove('show');
}
function confirmAddToday(){

/* ============ 点餐抽餐 ============ */
function doShake(){
  let pool = recipes.filter(r=>{
    if(pickType==='baby') return r.type==='baby';
    if(pickType==='adult') return r.type==='adult';
    return true;
  });
  if(pool.length === 0){ toast('菜谱库为空'); return; }
  const card = document.getElementById('resultCard');
  card.classList.add('shake-anim');
  card.classList.remove('has');
  let count = 0;
  const total = 12;
  const timer = setInterval(()=>{
    const r = pool[Math.floor(Math.random()*pool.length)];
    card.innerHTML = `<div class="rname">${escapeHtml(r.name)}</div>`;
    count++;
    if(count >= total){
      clearInterval(timer);
      card.classList.remove('shake-anim');
      const final = pool[Math.floor(Math.random()*pool.length)];
      showPickResult(card, final);
    }
  },80);
}
function showPickResult(card, r){
  card.classList.add('has');
  let tags = '';
  if(r.type==='baby'){
    tags = `<span class="tag month">${r.month}</span><span class="tag">${r.cook}</span>`;
  }else{
    tags = `<span class="tag cat">${r.cat||''}</span>`;
    if(r.spicy && r.spicy!=='不辣') tags += `<span class="tag spicy">${r.spicy}</span>`;
  }
  card.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px">今天就吃这个 👇</div>
    <div class="rname">${escapeHtml(r.name)}</div>
    <div class="rtags">${tags}</div>
    <div class="ring">${escapeHtml(r.ing||'')}</div>
    <button class="add-today" onclick='addPickedToToday(${JSON.stringify(r).replace(/'/g,"&#39;")})'>＋ 加入今日菜单</button>
  `;
}
function addPickedToToday(r){
  // r is object; ask which meal
  const mealKey = prompt('加入哪一餐？输入数字：1早餐 2午餐 3晚餐 4加餐','2');
  const map = {'1':'breakfast','2':'lunch','3':'dinner','4':'snack'};
  if(!map[mealKey]){ toast('已取消'); return; }
  todayMenu[map[mealKey]].push({id:r.id||uid(), name:r.name, type:r.type, done:false});
  saveMenu();
  renderMeals();
  toast(`已加入${MEALS.find(m=>m.key===map[mealKey]).label}`);
}

function doCombo(){
  const adults = recipes.filter(r=>r.type==='adult');
  if(adults.length < 2){ toast('大人餐菜谱不足'); return; }
  // pick 2 dishes from different cats + 1 soup-ish
  const card = document.getElementById('comboCard');
  card.classList.add('shake-anim');
  card.classList.remove('has');
  let count = 0;
  const timer = setInterval(()=>{
    const a = adults[Math.floor(Math.random()*adults.length)];
    const b = adults[Math.floor(Math.random()*adults.length)];
    card.innerHTML = `<div class="rname">${escapeHtml(a.name)} + ${escapeHtml(b.name)}</div>`;
    count++;
    if(count >= 10){
      clearInterval(timer);
      card.classList.remove('shake-anim');
      // final: pick from different categories
      const byCat = {};
      adults.forEach(r=>{ (byCat[r.cat]=byCat[r.cat]||[]).push(r); });
      const cats = Object.keys(byCat);
      let picks = [];
      if(cats.length >= 2){
        // pick 2 different cats
        const shuffled = cats.sort(()=>Math.random()-0.5);
        picks.push(byCat[shuffled[0]][0]);
        picks.push(byCat[shuffled[1]][0]);
      }else{
        picks = [...adults].sort(()=>Math.random()-0.5).slice(0,2);
      }
      // pick a "soup" - look for 汤类 or just a third
      const soups = adults.filter(r=>/汤|粥/.test(r.name));
      if(soups.length) picks.push(soups[Math.floor(Math.random()*soups.length)]);
      else if(adults.length>2) picks.push(adults.filter(r=>!picks.includes(r))[0]);

      card.classList.add('has');
      card.innerHTML = `
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">两菜一汤搭配 👇</div>
        ${picks.map(r=>`
          <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #eee;width:100%">
            <span style="font-size:18px">🍽️</span>
            <div style="flex:1;text-align:left">
              <div style="font-weight:700">${escapeHtml(r.name)}</div>
              <div style="font-size:11px;color:var(--muted)">${r.cat||''} ${r.spicy||''}</div>
            </div>
            <button class="add-today" style="padding:4px 10px;font-size:12px" onclick='addPickedToToday(${JSON.stringify(r).replace(/'/g,"&#39;")})'>加入</button>
          </div>
        `).join('')}
      `;
    }
  },100);
}

/* ============ 食材清单 ============ */
function renderShop(){
  const wrap = document.getElementById('shopList');
  // collect all ingredients from today's menu
  const ingMap = {};  // name -> {qty, dishes:[], type}
  let total = 0;
  MEALS.forEach(m=>{
    (todayMenu[m.key]||[]).forEach(it=>{
      const r = recipes.find(x=>x.id===it.id);
      if(!r || !r.ing) return;
      r.ing.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).forEach(name=>{
        if(!ingMap[name]) ingMap[name] = {count:0, dishes:[], types:new Set()};
        ingMap[name].count++;
        ingMap[name].dishes.push(it.name);
        ingMap[name].types.add(it.type);
        total++;
      });
    });
  });
  const items = Object.entries(ingMap).sort((a,b)=>b[1].count - a[1].count);
  if(items.length === 0){
    wrap.innerHTML = '<div class="empty-state">今日菜单还没添加菜品<br>去"今日菜单"添加后会自动汇总食材</div>';
    return;
  }
  wrap.innerHTML = items.map(([name, info])=>{
    const checked = shopChecked[name] ? 'checked' : '';
    const done = shopChecked[name] ? 'done' : '';
    return `
      <div class="shop-item ${done}">
        <input type="checkbox" class="chk" ${checked} onchange="toggleShop('${escapeHtml(name)}')">
        <span class="nm">${escapeHtml(name)}</span>
        <span class="qt">${info.count}份 · ${[...info.types].map(t=>t==='baby'?'👶':'👩').join('')}</span>
      </div>
    `;
  }).join('');
}
function toggleShop(name){
  if(shopChecked[name]) delete shopChecked[name];
  else shopChecked[name] = true;
  saveShop();
  renderShop();
}
function copyShopList(){
  const ingMap = {};
  MEALS.forEach(m=>{
    (todayMenu[m.key]||[]).forEach(it=>{
      const r = recipes.find(x=>x.id===it.id);
      if(!r || !r.ing) return;
      r.ing.split(/[,，、]/).map(s=>s.trim()).filter(Boolean).forEach(name=>{
        ingMap[name] = (ingMap[name]||0)+1;
      });
    });
  });
  const items = Object.entries(ingMap).sort((a,b)=>b[1]-a[1]);
  if(items.length === 0){ toast('今日还没添加菜品'); return; }
  const date = document.getElementById('todayDate').value;
  let text = `🛒 ${date} 采购清单\n`;
  text += '────────\n';
  items.forEach(([n,c])=>{ text += `☐ ${n}${c>1?` ×${c}`:''}\n`; });
  text += '────────\n';
  text += '共'+items.length+'种食材';
  // try clipboard
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板📋')).catch(()=>{
      fallbackCopy(text);
    });
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('已复制到剪贴板📋'); }
  catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ============ 家人点餐云端同步（MantleDB） ============ */
const CLOUD_URL = 'https://mantledb.sh/v2/nana-kitchen/orders';
let familyOrders = [];  // [{id, who, recipeId, name, type, meal, note, time}]

async function cloudRead(){
  try{
    const res = await fetch(CLOUD_URL);
    if(!res.ok) return {orders:[]};
    const data = await res.json();
    return data || {orders:[]};
  }catch(e){
    console.error('cloudRead err', e);
    return {orders:[]};
  }
}
async function cloudWrite(orders){
  try{
    const res = await fetch(CLOUD_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({orders, updatedAt: new Date().toISOString()})
    });
    return res.ok;
  }catch(e){
    console.error('cloudWrite err', e);
    return false;
  }
}

async function syncFamilyOrders(){
  const status = document.getElementById('syncStatus');
  status.textContent = '🔄 同步中...';
  const data = await cloudRead();
  familyOrders = data.orders || [];
  // 只看今天的
  const today = document.getElementById('todayDate').value;
  familyOrders = familyOrders.filter(o => (o.time||'').startsWith(today));
  const cnt = familyOrders.length;
  const whoSet = new Set(familyOrders.map(o=>o.who));
  status.textContent = cnt > 0
    ? `✅ 已同步 ${cnt} 条点餐，来自 ${whoSet.size} 位家人（${[...whoSet].join('、')}）`
    : '✅ 今日暂无家人点餐';
  renderFamily();
  toast('同步完成');
}

function renderFamily(){
  const wrap = document.getElementById('familyList');
  if(familyOrders.length === 0){
    wrap.innerHTML = '<div class="empty-state">暂无家人点餐<br>点上方"分享二维码"让家人扫码点餐<br>或点"同步家人点餐"刷新</div>';
    return;
  }
  // 按人分组
  const byWho = {};
  familyOrders.forEach(o=>{
    if(!byWho[o.who]) byWho[o.who] = [];
    byWho[o.who].push(o);
  });
  wrap.innerHTML = Object.entries(byWho).map(([who, list])=>{
    return `
      <div class="family-card">
        <div class="fhead">
          <span class="fname">👤 ${escapeHtml(who)}</span>
          <span class="ftime">${list.length}道</span>
        </div>
        ${list.map(o=>`
          <div>
            <span class="fpick ${o.type}">${o.type==='baby'?'👶':'👩'} ${escapeHtml(o.name)}</span>
            ${o.meal ? `<span style="font-size:11px;color:#999">${MEALS.find(m=>m.key===o.meal)?.label||o.meal}</span>` : ''}
            ${o.note ? `<div class="fnote">💬 ${escapeHtml(o.note)}</div>` : ''}
          </div>
        `).join('')}
        <div class="ftime" style="margin-top:6px">提交于 ${(list[0].time||'').slice(11,16)}</div>
      </div>
    `;
  }).join('');
}

function importFamilyOrders(){
  if(familyOrders.length === 0){
    toast('暂无家人点餐可导入');
    return;
  }
  if(!confirm(`将 ${familyOrders.length} 道家人点餐导入今日菜单？\n（会按家人选择的餐次分类导入）`)) return;
  let added = 0;
  familyOrders.forEach(o=>{
    const mealKey = o.meal || 'lunch';
    if(!todayMenu[mealKey]) todayMenu[mealKey] = [];
    // 避免重复（同名+同人视为重复）
    const exists = todayMenu[mealKey].some(it => it.name === o.name && it.who === o.who);
    if(!exists){
      todayMenu[mealKey].push({id:o.recipeId||uid(), name:o.name, type:o.type, done:false, who:o.who});
      added++;
    }
  });
  saveMenu();
  renderMeals();
  toast(`已导入 ${added} 道菜到今日菜单`);
  // 切到今日菜单
  document.querySelector('.tab[data-tab="menu"]').click();
}

/* —— 家人提交点餐到云端 —— */
async function submitFamilyOrder(order){
  // order: {who, recipeId, name, type, meal, note}
  const data = await cloudRead();
  const orders = data.orders || [];
  order.id = 'o'+Date.now()+Math.floor(Math.random()*1000);
  order.time = new Date().toLocaleString('sv-SE', {timeZone:'Asia/Shanghai'});
  orders.push(order);
  // 只保留最近200条，避免超容量
  const trimmed = orders.slice(-200);
  const ok = await cloudWrite(trimmed);
  if(ok){
    toast('已提交，等妈妈看到～');
  }else{
    toast('提交失败，请重试');
  }
  return ok;
}

/* —— 二维码分享 —— */
function showQR(){
  let url = new URL(window.location.href);
  url.searchParams.set('mode', 'family');
  url = url.toString();
  const qrApi = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(url);
  document.getElementById('qrImg').src = qrApi;
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrMask').classList.add('show');
}
function closeQR(){
  document.getElementById('qrMask').classList.remove('show');
}

/* ============ 家人点餐模式逻辑 ============ */
function initFamilyMode(){
  // 恢复身份
  const who = localStorage.getItem('kitchen_who');
  if(who) document.getElementById('fmWho').value = who;
  document.getElementById('fmWho').oninput = (e)=>{
    localStorage.setItem('kitchen_who', e.target.value);
  };
  document.getElementById('fmSearch').oninput = renderFmList;
  document.getElementById('fmType').onchange = renderFmList;
  renderFmList();
  renderFmCart();
}

function renderFmList(){
  const q = document.getElementById('fmSearch').value.trim().toLowerCase();
  const type = document.getElementById('fmType').value;
  const list = document.getElementById('fmList');
  const filtered = recipes.filter(r=>{
    if(q && !r.name.toLowerCase().includes(q) && !(r.ing||'').toLowerCase().includes(q)) return false;
    if(type !== 'all' && r.type !== type) return false;
    return true;
  });
  const babies = filtered.filter(r=>r.type==='baby');
  const adults = filtered.filter(r=>r.type==='adult');
  let html = '';
  if(babies.length){
    html += '<div class="sec-title"><span class="dot" style="background:var(--baby-accent)"></span>👶 宝宝辅食</div>';
    html += babies.map(r=>fmCard(r)).join('');
  }
  if(adults.length){
    html += '<div class="sec-title"><span class="dot" style="background:var(--adult-accent)"></span>👩 大人餐</div>';
    html += adults.map(r=>fmCard(r)).join('');
  }
  if(!filtered.length) html = '<div class="empty-state">没找到相关菜</div>';
  list.innerHTML = html;
}

function fmCard(r){
  const inCart = fmCart.some(c=>c.recipeId===r.id);
  let tags = '';
  if(r.type==='baby'){
    tags = `<span class="tag month">${r.month}</span><span class="tag">${r.cook}</span>`;
  }else{
    tags = `<span class="tag cat">${r.cat||''}</span>`;
    if(r.spicy && r.spicy!=='不辣') tags += `<span class="tag spicy">${r.spicy}</span>`;
  }
  return `
    <div class="card ${r.type}" style="margin-bottom:8px">
      <div class="thumb" style="${r.type==='baby'?'background:linear-gradient(135deg,#fef0f4,#f8e0e8)':''}">${recipeEmoji(r)}</div>
      <div class="name">${escapeHtml(r.name)}</div>
      <div class="tags">${tags}</div>
      <div class="ing"><b>食材：</b>${escapeHtml(r.ing||'')}</div>
      <button onclick="fmAdd('${r.id}')" style="margin-top:8px;width:100%;background:${inCart?'#ccc':'var(--primary)'};color:#fff;border:none;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">${inCart?'✓ 已加入点餐':'＋ 加入点餐'}</button>
    </div>
  `;
}

function fmAdd(id){
  const r = recipes.find(x=>x.id===id);
  if(!r) return;
  if(fmCart.some(c=>c.recipeId===id)){
    fmCart = fmCart.filter(c=>c.recipeId!==id);
  }else{
    const meal = prompt('这菜给哪一餐？输入数字：1早餐 2午餐 3晚餐 4加餐','2');
    const map = {'1':'breakfast','2':'lunch','3':'dinner','4':'snack'};
    const mealKey = map[meal] || 'lunch';
    fmCart.push({recipeId:r.id, name:r.name, type:r.type, meal:mealKey, note:''});
  }
  renderFmList();
  renderFmCart();
}

function renderFmCart(){
  const cart = document.getElementById('fmCart');
  const items = document.getElementById('fmCartItems');
  if(fmCart.length === 0){
    cart.style.display = 'none';
    return;
  }
  cart.style.display = 'block';
  items.innerHTML = fmCart.map((c,i)=>{
    const mealLabel = MEALS.find(m=>m.key===c.meal)?.label || c.meal;
    return `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee">
        <span style="flex:1;font-size:14px">${c.type==='baby'?'👶':'👩'} ${escapeHtml(c.name)} <span style="font-size:11px;color:#999">${mealLabel}</span></span>
        <button onclick="fmRemove(${i})" style="background:none;border:none;color:#c00;font-size:18px;cursor:pointer">×</button>
      </div>
    `;
  }).join('');
  document.getElementById('fmSubmitBtn').textContent = `提交点餐（${fmCart.length}道）`;
}

function fmRemove(idx){
  fmCart.splice(idx,1);
  renderFmList();
  renderFmCart();
}

async function fmSubmit(){
  const who = document.getElementById('fmWho').value.trim();
  if(!who){ alert('请先填写"我是谁"'); return; }
  if(fmCart.length === 0){ alert('请先选菜'); return; }
  const btn = document.getElementById('fmSubmitBtn');
  btn.textContent = '提交中...';
  btn.disabled = true;
  let okCount = 0;
  for(const c of fmCart){
    const ok = await submitFamilyOrder({who, ...c});
    if(ok) okCount++;
  }
  if(okCount === fmCart.length){
    btn.textContent = '✅ 提交成功！';
    btn.style.background = 'var(--green)';
    fmCart = [];
    renderFmCart();
    setTimeout(()=>{
      btn.textContent = '提交点餐';
      btn.disabled = false;
      btn.style.background = 'var(--primary)';
    }, 2000);
    alert('点餐已提交！妈妈打开工作台点"同步"就能看到～');
  }else{
    btn.textContent = '提交点餐';
    btn.disabled = false;
    alert('部分提交失败，请重试');
  }
}

/* ============ 启动 ============ */
init();
</script>
